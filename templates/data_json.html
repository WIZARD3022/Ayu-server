<!DOCTYPE html>
<html>
<head>
    <title>Sensor Data</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
    <meta http-equiv="refresh" content="5"> <!-- auto-refresh every 5 sec -->
</head>
<body>
    <div class="container">
        <h1>Sensor Data Graphs</h1>
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <a href="/" class="btn">Home</a>
            <a href="/download_csv" class="btn" style="background-color: #4CAF50;">Download CSV</a>
        </div>

        <div class="graphs">
            {% for graph in graphs %}
                <div id="graph{{ loop.index0 }}" style="width:100%;height:400px;margin-bottom:30px;"></div>
            {% endfor %}
        </div>

        <script>
            // Render all graphs
            {% for graph in graphs %}
                (function() {
                    const fig = JSON.parse(`{{ graph | safe }}`);
                    Plotly.newPlot('graph{{ loop.index0 }}', fig.data, fig.layout, {responsive: true});
                })();
            {% endfor %}
        </script>
    </div>
</body>
</html>
