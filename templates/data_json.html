<!DOCTYPE html>
<html>
<head>
    <title>Sensor Data</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Sensor Data Graphs</h1>
        <a href="/" class="btn">Home</a>
        <div class="graphs">
            {% for graph in graphs %}
                <div id="graph{{ loop.index0 }}" style="width:100%;height:400px;"></div>
                <script>
                    var fig = {{ graph | safe }};
                    Plotly.newPlot('graph{{ loop.index0 }}', fig.data, fig.layout);
                </script>
            {% endfor %}
        </div>
    </div>
</body>
</html>
