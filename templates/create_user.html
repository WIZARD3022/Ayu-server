<!DOCTYPE html>
<html>
<head>
    <title>Create User</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
    <h2>Create User</h2>
    <a href="/" class="btn">Home</a>

    <form action="/save" method="POST">

        <label>Name</label>
        <input type="text" name="name" required>

        <label>Age</label>
        <input type="number" name="age" required>

        <label>Gender</label>
        <select name="gender" required>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <label>Mobile No</label>
        <input type="text" name="mobile" required>

        <hr>

        <h3>Questions</h3>

        {% for q in questions %}
            <div class="question-block">
                <p><b>{{ loop.index }}. {{ q.q }}</b></p>

                <label><input type="radio" name="q{{ loop.index }}" value="A" required> {{ q.a }}</label><br>
                <label><input type="radio" name="q{{ loop.index }}" value="B"> {{ q.b }}</label><br>
                <label><input type="radio" name="q{{ loop.index }}" value="C"> {{ q.c }}</label><br>
            </div>
        {% endfor %}

        <button type="submit" class="btn">Save</button>

    </form>
</div>
</body>
</html>
